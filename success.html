<!doctype html>
<html lang="en">

<head>

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <meta
    name="theme-color"
    content="#05050a"
  >

  <title>
    Signal Received | JigyasaVerse
  </title>

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600&family=Gloock&display=swap"
    rel="stylesheet"
  >

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      display: grid;
      place-items: center;

      min-height: 100vh;

      margin: 0;
      padding: 25px;

      overflow: hidden;

      color: #fff1ca;

      background:
        radial-gradient(
          circle at 50% 45%,
          rgba(169, 151, 255, 0.2),
          transparent 28%
        ),
        radial-gradient(
          circle at 50% 100%,
          rgba(240, 181, 91, 0.13),
          transparent 30%
        ),
        #05050a;

      font-family: "DM Sans", sans-serif;
      text-align: center;
    }

    body::before {
      position: fixed;
      top: 8%;
      right: 0;
      left: 0;

      content: "✦  ·  ✦  ·  ✦  ·  ✦  ·  ✦";

      color: rgba(255, 241, 202, 0.22);

      letter-spacing: 3vw;
    }

    .success-card {
      position: relative;

      width: min(690px, 100%);

      padding: clamp(35px, 7vw, 80px);

      border: 1px solid rgba(240, 181, 91, 0.3);
      border-radius: 35px;

      background: rgba(14, 11, 23, 0.88);

      box-shadow:
        0 40px 120px rgba(0, 0, 0, 0.5);
    }

    .pulse {
      width: 18px;
      height: 18px;

      margin: 0 auto 28px;

      border-radius: 50%;

      background: #7df8ad;

      box-shadow:
        0 0 0 12px rgba(125, 248, 173, 0.07),
        0 0 35px #7df8ad;
    }

    .eyebrow {
      color: #f0b55b;

      font-size: 0.7rem;
      font-weight: 600;

      letter-spacing: 0.2em;
      text-transform: uppercase;
    }

    h1 {
      margin: 20px 0;

      font-family: "Gloock", serif;
      font-size: clamp(3.2rem, 8vw, 6.8rem);
      font-weight: 400;
      line-height: 0.92;

      letter-spacing: -0.05em;
    }

    p {
      max-width: 520px;

      margin: 0 auto 32px;

      color: rgba(255, 241, 202, 0.65);

      line-height: 1.7;
    }

    a {
      display: inline-flex;

      padding: 13px 19px;

      color: #05050a;

      border-radius: 999px;

      background: #f0b55b;

      font-size: 0.72rem;
      font-weight: 600;

      letter-spacing: 0.1em;
      text-decoration: none;
      text-transform: uppercase;
    }

    a:hover {
      background: #ffd48a;
    }

    a:focus-visible {
      outline: 3px solid #fff1ca;
      outline-offset: 4px;
    }

  </style>

</head>

<body>

  <main class="success-card">

    <div
      class="pulse"
      aria-hidden="true"
    ></div>

    <span class="eyebrow">
      Transmission received · channel open
    </span>

    <h1>
      Your signal<br>
      has landed.
    </h1>

    <p>
      Thank you for sending the unfinished thought.
      It will be read with care. If your message needs
      a response, JigyasaVerse will reply when capacity
      allows.
    </p>

    <a href="https://jigyasaverse.org/">
      Return to the Verse ↗
    </a>

  </main>

</body>
</html>
